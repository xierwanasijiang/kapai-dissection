<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>烬塔远征</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=Barlow+Condensed:wght@600;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#0B0E13;--ash:#141821;--ash2:#1C212C;--ash3:#262C39;
  --line:rgba(214,196,160,.16);--line2:rgba(214,196,160,.3);
  --paper:#EFE6D2;--muted:#A89F8C;--dim:#6E6758;
  --ember:#FF7A3D;--ember2:#FFB36B;--gold:#E7C274;--hp:#D9453B;--block:#5AA9E6;--poison:#7CCB5B;--skill:#4FA3A0;--power:#D9A441;--curse:#8E6FB0;
  --serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--num:"Barlow Condensed","Oswald","Arial Narrow",sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit}
#wrap{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#2a1712 0%,var(--ink) 60%)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.layer{position:absolute;inset:0}
#bg{pointer-events:none}
#view{top:52px}
#hud{height:52px;z-index:20;display:flex;align-items:center;gap:18px;padding:0 16px;background:linear-gradient(180deg,rgba(11,14,19,.96),rgba(11,14,19,.82));border-bottom:1px solid var(--line);font-size:14px}
#hud[hidden]{display:none}
#hud .who{font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.04em}
#hud .stat{display:flex;align-items:center;gap:6px;font-family:var(--num);font-weight:600;font-size:21px;letter-spacing:.02em}
#hud .stat svg{width:20px;height:20px}
#hud .pots{display:flex;gap:6px}
#hud .pot{width:30px;height:30px;border-radius:8px;border:1px dashed var(--line2);display:grid;place-items:center;cursor:pointer;background:transparent;padding:0;transition:transform .15s,border-color .15s}
#hud .pot.has{border-style:solid;border-color:var(--line2);background:rgba(255,255,255,.03)}
#hud .pot:hover{transform:translateY(-2px);border-color:var(--ember)}
#hud .relics{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
#hud .relic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto;cursor:default}
#hud .relic .cnt{position:absolute;right:-3px;bottom:-4px;font-family:var(--num);font-size:13px;font-weight:800;color:var(--paper);text-shadow:0 1px 2px #000}
#hud .relic.flash{animation:rflash .6s ease}
@keyframes rflash{0%{transform:scale(1)}40%{transform:scale(1.45);filter:drop-shadow(0 0 8px var(--gold))}100%{transform:scale(1)}}
#hud .right{display:flex;align-items:center;gap:8px;margin-left:auto}
.hbtn svg{width:18px;height:18px;flex:0 0 auto}
.hbtn{white-space:nowrap;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--paper);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s}
.hbtn:hover{border-color:var(--ember);background:rgba(255,122,61,.1)}
.hbtn b{font-family:var(--num);font-size:17px;font-weight:600}
.floorlbl{font-family:var(--num);font-size:18px;color:var(--muted);letter-spacing:.06em}

#fx{pointer-events:none;z-index:40}
#ov{z-index:60;pointer-events:none}
#ov>*{pointer-events:auto}
#tip{position:absolute;z-index:80;pointer-events:none;max-width:280px;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
.tipbox{background:rgba(14,17,23,.97);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.55;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tipbox b{display:block;color:var(--paper);font-size:14px;margin-bottom:2px;font-weight:700}
.tipbox em{font-style:normal;color:var(--gold)}

/* generic */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--paper);background:linear-gradient(180deg,#2b2f3a,#1b1f28);border:1px solid var(--line2);border-radius:10px;padding:10px 26px;cursor:pointer;transition:transform .12s,border-color .15s,box-shadow .2s;letter-spacing:.06em}
.btn:hover{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,122,61,.15),0 8px 24px rgba(0,0,0,.4);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:linear-gradient(180deg,#ff8a4f,#d9582a);border-color:#ffb38a;color:#1a0d06}
.btn.primary:hover{box-shadow:0 0 0 3px rgba(255,122,61,.3),0 10px 30px rgba(217,88,42,.4)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{font-size:15px;padding:7px 18px}
h1.title{font-family:var(--serif);font-weight:900;font-size:108px;margin:0;letter-spacing:.12em;line-height:1;background:linear-gradient(180deg,#fff4dc 10%,#ffb36b 55%,#e0582a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(255,122,61,.35))}
.subtitle{font-family:var(--num);letter-spacing:.5em;color:var(--muted);font-size:18px;margin-top:10px;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:48px;min-width:240px}
.foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--dim);font-size:12px}

/* char select */
.chars{display:flex;gap:28px;margin-top:26px}
.char{width:330px;border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(180deg,rgba(38,44,57,.6),rgba(20,24,33,.8));cursor:pointer;transition:transform .25s,border-color .2s,box-shadow .25s;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.char:hover{transform:translateY(-6px)}
.char.sel{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,122,61,.18),0 20px 50px rgba(0,0,0,.5)}
.char .art{height:250px;display:flex;align-items:flex-end}
.char .nm{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.1em;margin-top:6px}
.char .ep{color:var(--muted);font-size:13px}
.char .row{display:flex;gap:18px;margin-top:10px;font-family:var(--num);font-size:20px}
.char .desc{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.6;min-height:42px}

/* cards */
.card{position:absolute;width:160px;height:222px;border-radius:12px;transform-origin:50% 50%;will-change:transform;cursor:pointer;--c:var(--ember);--c2:#5a2414}
.card .fr{position:absolute;inset:0;border-radius:12px;background:linear-gradient(170deg,var(--c2),#16110f 70%);border:2px solid var(--c);box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 0 0 3px rgba(0,0,0,.35)}
.card.skill{--c:var(--skill);--c2:#16393a}
.card.power{--c:var(--power);--c2:#3d2c0d}
.card.status{--c:#77706a;--c2:#262422}
.card.curse{--c:var(--curse);--c2:#2a1d38}
.card .nm{position:absolute;left:10px;right:10px;top:10px;height:28px;border-radius:6px;background:rgba(0,0,0,.4);display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:16px;letter-spacing:.04em;white-space:nowrap}
.card.up .nm{color:#9ff08f}
.card .art{position:absolute;left:14px;right:14px;top:44px;height:78px;border-radius:6px;background:radial-gradient(ellipse at 50% 70%,rgba(255,255,255,.08),rgba(0,0,0,.4));display:grid;place-items:center;overflow:hidden}
.card .art svg{width:64px;height:64px}
.card .tp{position:absolute;left:0;right:0;top:124px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.2em}
.card .ds{position:absolute;left:12px;right:12px;top:142px;bottom:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.5;color:var(--paper)}
.card .ds b{color:var(--gold);font-weight:700}
.card .ds .n{font-family:var(--num);font-size:17px;font-weight:800;color:var(--paper)}
.card .ds .n.hi{color:#8ef07a}.card .ds .n.lo{color:#ff7b6b}
.card .cost{position:absolute;left:-10px;top:-10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:24px;color:#1a0d06;background:radial-gradient(circle at 35% 30%,#ffe1a6,#ff8a3d 55%,#b8431b);box-shadow:0 0 0 2px #1a0d06,0 3px 8px rgba(0,0,0,.6)}
.card .cost.cant{color:#ffdddd;background:radial-gradient(circle at 35% 30%,#b5a19a,#6b5550 60%,#3b2c29)}
.card.glow .fr{box-shadow:0 0 0 2px var(--c),0 0 18px 2px rgba(120,220,255,.55),0 10px 24px rgba(0,0,0,.55)}
.card.sel .fr{box-shadow:0 0 0 3px #fff,0 0 26px 6px rgba(255,190,120,.6)}
.card.pick .fr{box-shadow:0 0 0 3px #8ef07a,0 0 20px rgba(142,240,122,.5)}

/* battle */
#hand{position:absolute;inset:0;pointer-events:none;z-index:10}
#hand .card{pointer-events:auto;transition:transform .22s cubic-bezier(.2,.8,.2,1),left .22s,top .22s,opacity .2s}
#hand .card.drag{transition:none}
.ent{position:absolute;display:flex;flex-direction:column;align-items:center}
.ent .body{position:relative;transform-origin:50% 100%;transition:transform .18s,filter .2s}
.ent .body.idle{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
.ent .body.hit{animation:hitk .32s ease}
@keyframes hitk{0%{transform:translateX(0);filter:brightness(2.2) saturate(0)}30%{transform:translateX(10px)}60%{transform:translateX(-6px)}100%{transform:none;filter:none}}
.ent .body.lunge-l{animation:lungel .35s ease}
.ent .body.lunge-r{animation:lunger .35s ease}
@keyframes lunger{40%{transform:translateX(60px)}}
@keyframes lungel{40%{transform:translateX(-60px)}}
.ent .body.dying{animation:die .8s ease forwards}
@keyframes die{to{opacity:0;transform:translateY(20px) scale(.9);filter:brightness(3) blur(4px)}}
.ent .shadow{position:absolute;bottom:-6px;left:50%;width:70%;height:18px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%)}
.bar{width:170px;height:12px;border-radius:6px;background:#2a0f0d;border:1px solid rgba(0,0,0,.6);position:relative;margin-top:10px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(180deg,#ff6a5a,#b0261d);transition:width .35s}
.bar i.pz{background:linear-gradient(180deg,#9ce07a,#4a9a2d)}
.bar .t{position:absolute;inset:-4px 0;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:15px;text-shadow:0 1px 2px #000,0 0 3px #000}
.bar.blk{border-color:var(--block);box-shadow:0 0 0 1px var(--block)}
.bar.blk i{background:linear-gradient(180deg,#8fd0ff,#3b86c4)}
.blkb{position:absolute;left:-22px;top:50%;transform:translateY(-50%);width:30px;height:32px;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 2px #000}
.blkb svg{position:absolute;inset:0}
.blkb span{position:relative}
.pows{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:190px;margin-top:6px;min-height:24px}
.pw{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;border:1px solid rgba(0,0,0,.4)}
.pw .a{position:absolute;right:-5px;bottom:-5px;font-family:var(--num);font-weight:800;font-size:13px;text-shadow:0 1px 2px #000,0 0 2px #000}
.pw.buff{background:#3a3120;color:var(--gold)}
.pw.debuff{background:#3a1c1c;color:#ff8a7a}
.pw.pop{animation:pwpop .5s ease}
@keyframes pwpop{0%{transform:scale(2.2);opacity:.3}100%{transform:scale(1);opacity:1}}
.intent{position:absolute;top:-58px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;animation:bob 2s ease-in-out infinite;font-family:var(--num);font-weight:800;font-size:22px;text-shadow:0 2px 3px #000;white-space:nowrap}
.intent svg{width:40px;height:40px}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.ent.tgt .body{filter:drop-shadow(0 0 10px rgba(255,160,90,.95)) drop-shadow(0 0 2px #fff)}
.ent .nmtag{font-size:13px;color:var(--muted);margin-top:4px;opacity:0;transition:opacity .15s}
.ent:hover .nmtag,.ent.tgt .nmtag{opacity:1}
.energy{position:absolute;left:44px;bottom:190px;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:38px;color:#1a0d06;background:radial-gradient(circle at 35% 30%,#fff0c4,#ff9a4a 50%,#a83a12 90%);box-shadow:0 0 0 3px #1a0d06,0 0 40px rgba(255,122,61,.5);z-index:12}
.energy.zero{filter:grayscale(.8) brightness(.7);box-shadow:0 0 0 3px #1a0d06}
.energy.pulse{animation:epulse .5s ease}
@keyframes epulse{40%{transform:scale(1.18)}}
.pile{position:absolute;bottom:18px;width:74px;height:74px;border-radius:50%;border:1px solid var(--line2);background:rgba(20,24,33,.9);display:grid;place-items:center;cursor:pointer;z-index:12;transition:transform .15s,border-color .15s}
.pile:hover{transform:scale(1.07);border-color:var(--ember)}
.pile .c{position:absolute;right:-4px;bottom:-4px;min-width:28px;height:28px;border-radius:14px;background:#0b0e13;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:17px;padding:0 5px}
.pile svg{width:36px;height:36px}
#endTurn{position:absolute;right:110px;bottom:110px;z-index:12;min-width:140px}
#endTurn.hot{animation:hot 1.4s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 0 4px rgba(255,122,61,.35),0 0 30px rgba(255,122,61,.5)}}
.banner{position:absolute;left:0;right:0;top:230px;height:90px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:46px;letter-spacing:.3em;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 25%,rgba(0,0,0,.75) 75%,transparent);animation:banner 1.3s ease forwards;pointer-events:none;z-index:45}
@keyframes banner{0%{opacity:0;transform:scaleY(.2)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.float{position:absolute;font-family:var(--num);font-weight:800;font-size:44px;color:#fff;text-shadow:0 3px 0 #000,0 0 10px rgba(0,0,0,.8);animation:fl 1s ease-out forwards;transform:translate(-50%,-50%)}
.float.blk{color:#9fd4ff;font-size:32px}
.float.heal{color:#8ef07a;font-size:34px}
.float.txt{font-family:var(--serif);font-size:24px;color:var(--gold)}
.float.pz{color:var(--poison)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
#arrow{position:absolute;inset:0;pointer-events:none;z-index:30}
.selbar{position:absolute;left:50%;top:170px;transform:translateX(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;gap:12px}
.selbar .msg{font-family:var(--serif);font-weight:900;font-size:26px;text-shadow:0 2px 8px #000}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(6px,-4px)}40%{transform:translate(-6px,3px)}60%{transform:translate(4px,2px)}80%{transform:translate(-3px,-2px)}}

/* modal & grid */
.modal{position:absolute;inset:0;background:rgba(6,8,11,.86);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;padding:30px 40px;z-index:70;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.modal h2{font-family:var(--serif);font-weight:900;font-size:30px;margin:6px 0 4px;letter-spacing:.08em}
.modal .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.grid{flex:1;width:100%;overflow-y:auto;display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;align-content:flex-start;padding:16px 10px 30px}
.grid .slot{position:relative;width:160px;height:222px;flex:0 0 auto}
.grid .card{position:absolute;left:0;top:0;transition:transform .15s}
.grid .card:hover{transform:scale(1.07);z-index:3}
.modal .acts{display:flex;gap:12px;margin-top:10px}

/* map */
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#3a3f4c transparent}
#mapInner{position:relative;width:1280px;height:1240px;background:radial-gradient(ellipse at 50% 30%,rgba(231,194,116,.06),transparent 60%)}
.mapsheet{position:absolute;left:340px;width:600px;top:20px;bottom:20px;border-radius:14px;background:linear-gradient(180deg,#1d1a17,#15130f);border:1px solid rgba(231,194,116,.18);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mnode{cursor:default}
.mnode.av{cursor:pointer}
.mnode.av .ring{animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{r:26;opacity:.2}}
.mnode.av:hover .ic{transform:scale(1.25)}
.mnode .ic{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.maplegend{position:absolute;right:40px;top:24px;z-index:2;width:190px;border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(20,24,33,.85);font-size:14px;display:flex;flex-direction:column;gap:8px}
.maplegend div{display:flex;align-items:center;gap:10px}
.maplegend svg{width:22px;height:22px}
.mapinfo{position:absolute;left:40px;top:24px;z-index:2;width:240px;color:var(--muted);font-size:13px;line-height:1.7}
.mapinfo h3{font-family:var(--serif);color:var(--paper);font-size:24px;margin:0 0 6px}

/* rooms */
.panel{background:linear-gradient(180deg,rgba(38,44,57,.8),rgba(20,24,33,.92));border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.rewards{width:460px;padding:22px;display:flex;flex-direction:column;gap:10px}
.rewards h2{font-family:var(--serif);font-weight:900;text-align:center;margin:0 0 6px;font-size:28px;letter-spacing:.1em}
.rw{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);cursor:pointer;font-size:16px;transition:all .15s;color:var(--paper);text-align:left;width:100%}
.rw:hover{border-color:var(--ember);background:rgba(255,122,61,.08);transform:translateX(3px)}
.rw.got{opacity:.35;pointer-events:none}
.rw svg{width:30px;height:30px;flex:0 0 auto}
.choice-row{display:flex;gap:40px;margin:44px 0 40px}
.choice-row .slot{position:relative;width:160px;height:222px}
.choice-row .card{transform:scale(1.15);transition:transform .2s}
.choice-row .card:hover{transform:scale(1.25) translateY(-6px)}
.event{display:flex;gap:34px;width:1060px;align-items:stretch}
.event .pic{width:380px;height:440px;border-radius:14px;overflow:hidden;flex:0 0 auto;border:1px solid var(--line2)}
.event .pic svg{width:100%;height:100%;display:block}
.event .txt{flex:1;display:flex;flex-direction:column;gap:14px;padding:10px 0}
.event h2{font-family:var(--serif);font-weight:900;font-size:36px;margin:0;letter-spacing:.08em}
.event p{font-size:16px;line-height:1.85;color:#d9cfbb;margin:0}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--paper);font-size:15px;cursor:pointer;transition:all .15s;line-height:1.5}
.opt:hover{border-color:var(--ember);background:rgba(255,122,61,.1);transform:translateX(4px)}
.opt b{color:var(--gold);font-weight:700;margin-right:6px}
.opt .g{color:#8ef07a}.opt .r{color:#ff7b6b}
.opt[disabled]{opacity:.4;pointer-events:none}
.shop{display:grid;grid-template-columns:1fr 330px;gap:30px;width:1180px;align-items:start}
.shop .cards{display:flex;flex-wrap:wrap;gap:26px 22px}
.shop .item{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.shop .item .slot{position:relative;width:160px;height:222px}
.shop .item .card{transition:transform .15s}
.shop .item:hover .card{transform:translateY(-6px) scale(1.04)}
.price{font-family:var(--num);font-weight:800;font-size:22px;color:var(--gold);display:flex;align-items:center;gap:4px}
.price.no{color:#ff7b6b}
.price s{color:var(--dim);font-size:16px}
.shop .side{display:flex;flex-direction:column;gap:14px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);cursor:pointer;transition:all .15s}
.srow:hover{border-color:var(--ember)}
.srow.sold{opacity:.3;pointer-events:none}
.srow .i{width:42px;height:42px;display:grid;place-items:center;flex:0 0 auto}
.srow .n{flex:1;font-size:14px;line-height:1.35}
.srow .n small{display:block;color:var(--muted);font-size:12px}
.rest{display:flex;gap:40px;margin-top:20px}
.rest .opt2{width:220px;height:240px;border-radius:18px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(38,44,57,.7),rgba(20,24,33,.9));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .2s;color:var(--paper)}
.rest .opt2:hover{border-color:var(--ember);transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.rest .opt2 svg{width:80px;height:80px}
.rest .opt2 b{font-family:var(--serif);font-size:24px}
.rest .opt2 span{color:var(--muted);font-size:13px}
.fire{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.05,.95)}}
.stats{display:grid;grid-template-columns:1fr auto;gap:8px 40px;font-size:16px;min-width:360px;margin:20px 0 26px}
.stats b{font-family:var(--num);font-size:22px;text-align:right}
.toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);padding:10px 18px;border-radius:10px;background:rgba(14,17,23,.95);border:1px solid var(--line2);z-index:90;font-size:15px;animation:toast 1.8s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.potmenu{position:absolute;z-index:85;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;background:rgba(14,17,23,.98);border:1px solid var(--line2)}
.potmenu button{min-width:110px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
/* ===================== core utils ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

let SCALE=1;
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);SCALE=s;stage.style.transform=`scale(${s})`;
  stage.style.left=((innerWidth-1280*s)/2)+'px';stage.style.top=((innerHeight-720*s)/2)+'px'}

/* ===================== RNG (xorshift128+, same as the dissected port) ===================== */
function mix64(v){let x=BigInt.asUintN(64,v);x^=x>>33n;x=BigInt.asUintN(64,x*0xff51afd7ed558ccdn);x^=x>>33n;x=BigInt.asUintN(64,x*0xc4ceb9fe1a85ec53n);return x^(x>>33n)}
class Rng{
  constructor(seed){this.s0=mix64(seed===0n?-9223372036854775808n:seed);this.s1=mix64(this.s0);this.counter=0}
  nextLong(){let a=this.s0;const b=this.s1;this.s0=b;a^=BigInt.asUintN(64,a<<23n);this.s1=a^b^(a>>17n)^(b>>26n);return BigInt.asUintN(64,this.s1+b)}
  nextInt(n){const L=BigInt(n);for(;;){const bits=this.nextLong()>>1n,v=bits%L;if(BigInt.asIntN(64,bits-v+L-1n)>=0n)return Number(v)}}
  random(a,b){this.counter++;return b===undefined?this.nextInt(a+1):a+this.nextInt(b-a+1)}
  randomFloat(a=0,b=1){this.counter++;const v=Number(this.nextLong()>>40n)/16777216;return Math.fround(a+Math.fround(v*Math.fround(b-a)))}
  randomBoolean(ch){if(ch!==undefined)return this.randomFloat()<Math.fround(ch);this.counter++;return(this.nextLong()&1n)!==0n}
  shuffle(x){for(let r=x.length;r>1;r--){const s=this.nextInt(r);[x[r-1],x[s]]=[x[s],x[r-1]]}return x}
  pick(arr){return arr[this.random(arr.length-1)]}
  state(){return{s0:this.s0.toString(),s1:this.s1.toString(),c:this.counter}}
  static from(st){const r=new Rng(1n);r.s0=BigInt(st.s0);r.s1=BigInt(st.s1);r.counter=st.c;return r}
}
const ALPHA='0123456789ABCDEFGHIJKLMNPQRSTUVWXYZ';
const seedStr=v=>{let u=BigInt.asUintN(64,v),s='';if(u===0n)return'0';while(u>0n){s=ALPHA[Number(u%35n)]+s;u/=35n}return s};
const newSeed=()=>{const w=new Uint32Array(2);crypto.getRandomValues(w);return BigInt.asIntN(64,(BigInt(w[0])<<32n)|BigInt(w[1]))};
const f32=Math.fround;

/* ===================== audio (synth) ===================== */
const SFX={ctx:null,on:true,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch{}},
  noise(d,freq,type='lowpass',vol=.5,q=1){const c=this.ctx;if(!c||!this.on)return;const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);
    const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=freq;fl.Q.value=q;const g=c.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(c.destination);s.start()},
  tone(f,d,type='sine',vol=.2,slide=0,delay=0){const c=this.ctx;if(!c||!this.on)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d)},
  play(k){if(!this.ctx||!this.on)return;switch(k){
    case'hit':this.noise(.16,1400,'lowpass',.6);this.tone(120,.18,'sine',.35,.4);break;
    case'heavy':this.noise(.3,900,'lowpass',.8);this.tone(80,.35,'sine',.5,.3);break;
    case'block':this.tone(1250,.12,'triangle',.12);this.tone(1880,.16,'triangle',.08,1,.02);this.noise(.06,3000,'highpass',.15);break;
    case'card':this.noise(.09,2600,'highpass',.18);break;
    case'draw':this.noise(.05,4200,'highpass',.07);break;
    case'coin':this.tone(1318,.09,'square',.05);this.tone(1760,.16,'square',.05,1,.07);break;
    case'buff':this.tone(440,.25,'triangle',.12,2);break;
    case'debuff':this.tone(420,.3,'sawtooth',.06,.5);break;
    case'heal':this.tone(660,.2,'sine',.12,1.5);this.tone(990,.25,'sine',.08,1.2,.08);break;
    case'death':this.noise(.6,600,'lowpass',.5);this.tone(200,.6,'sawtooth',.1,.25);break;
    case'click':this.tone(900,.05,'triangle',.08);break;
    case'poison':this.noise(.2,700,'bandpass',.35,4);break;
    case'turn':this.tone(330,.35,'triangle',.1,1.5);break;
    case'win':[523,659,784,1046].forEach((f,i)=>this.tone(f,.4,'triangle',.1,1,i*.12));break;}}};
addEventListener('pointerdown',()=>{SFX.init();if(SFX.ctx&&SFX.ctx.state==='suspended')SFX.ctx.resume()},{capture:true});

let UID=1;
function makeCard(id,up=false){const d=CARDS[id];const c={uid:UID++,id,n:d.n,type:d.type,rarity:d.rarity,color:d.color,cost:d.cost,dmg:d.dmg,blk:d.blk,mag:d.mag,ex:!!d.ex,eth:!!d.eth,innate:!!d.innate,target:d.target,up:0,costTurn:null};if(up)upgradeCard(c);return c}
function copyCard(c){const x=makeCard(c.id,!!c.up);x.dmg=c.dmg;return x}
const canUpgrade=c=>!c.up&&c.type!=='STATUS'&&c.type!=='CURSE';
function upgradeCard(c){if(!canUpgrade(c))return;const u=CARDS[c.id].up;c.up=1;for(const k of ['cost','dmg','blk','mag']){if(u[k]!==undefined){c[k]=k==='dmg'?c.dmg+(u.dmg-CARDS[c.id].dmg):u[k]}}
  if(u.ex!==undefined)c.ex=u.ex;if(u.innate!==undefined)c.innate=u.innate;if(u.eth!==undefined)c.eth=u.eth;if(c.costTurn!==null&&u.cost!==undefined)c.costTurn=Math.min(c.costTurn,u.cost)}
const cardName=c=>c.n+(c.up?'+':'');
const poolOf=(color,rarity)=>Object.values(CARDS).filter(d=>d.color===color&&d.rarity===rarity);

const ENC_NAME={'Cultist':'咏火信徒','Jaw Worm':'铁颚蠕虫','2 Louse':'两只血虱','Small Slimes':'小黏体','Blue Slaver':'蓝索奴役者','Red Slaver':'赤鞭奴役者','Looter':'夜行窃贼','Large Slime':'大黏体','Lots of Slimes':'黏体群','Exordium Thugs':'路匪','Exordium Wildlife':'荒野生物','3 Louse':'三只血虱','2 Fungi Beasts':'两只孢伞兽','Gremlin Nob':'巨角蛮兵','Lagavulin':'沉眠铠壳','3 Sentries':'符文哨柱阵','The Guardian':'守誓机兵','Hexaghost':'六焰游魂','Slime Boss':'巨噬黏王'};
const WEAK=[['Cultist',2],['Jaw Worm',2],['2 Louse',2],['Small Slimes',2]];
const STRONG=[['Blue Slaver',2],['Looter',2],['Large Slime',2],['Lots of Slimes',1],['Exordium Thugs',1.5],['Exordium Wildlife',1.5],['Red Slaver',1],['3 Louse',2],['2 Fungi Beasts',2]];
const ELITES=[['Gremlin Nob',1],['Lagavulin',1],['3 Sentries',1]];
const BOSSES=['The Guardian','Hexaghost','Slime Boss'];
function normEnc(pool){const s=[...pool].sort((a,b)=>a[1]-b[1]);const t=s.reduce((a,e)=>f32(a+e[1]),0);return s.map(([n,w])=>[n,f32(w/t)])}
function rollEnc(pool,roll){let w=0;for(const e of pool){w=f32(w+e[1]);if(roll<w)return e[0]}return pool[pool.length-1][0]}
function buildEncounters(rng){const normal=[],elite=[];
  const populate=(src,count,q,lb)=>{const p=normEnc(src);while(count>0){const e=rollEnc(p,rng.randomFloat());if(q.slice(-lb).includes(e))continue;q.push(e);count--}};
  populate(WEAK,3,normal,2);
  const ex={Looter:['Exordium Thugs'],'Blue Slaver':['Red Slaver','Exordium Thugs'],'2 Louse':['3 Louse'],'Small Slimes':['Large Slime','Lots of Slimes']};
  const prev=normal[normal.length-1],p=normEnc(STRONG);let first;do{first=rollEnc(p,rng.randomFloat())}while(ex[prev]&&ex[prev].includes(first));normal.push(first);
  populate(STRONG,12,normal,2);populate(ELITES,10,elite,1);return{normal,elite}}
function encounterIds(key,r){const louse=()=>r.randomBoolean()?'LouseR':'LouseG',slaver=()=>r.randomBoolean()?'SlaverR':'SlaverB';
  const pick=a=>a[r.random(a.length-1)];
  switch(key){
    case'Cultist':return['Cultist'];case'Jaw Worm':return['JawWorm'];case'Blue Slaver':return['SlaverB'];case'Red Slaver':return['SlaverR'];case'Looter':return['Looter'];
    case'2 Louse':return[louse(),louse()];case'3 Louse':return[louse(),louse(),louse()];case'2 Fungi Beasts':return['Fungi','Fungi'];
    case'Large Slime':return[r.randomBoolean()?'AcidL':'SpikeL'];
    case'Small Slimes':return r.randomBoolean()?['SpikeS','AcidM']:['AcidS','SpikeM'];
    case'Lots of Slimes':{const p=['SpikeS','SpikeS','SpikeS','AcidS','AcidS'];return Array.from({length:5},()=>p.splice(r.random(p.length-1),1)[0])}
    case'Exordium Thugs':return[pick([louse(),'SpikeM','AcidM']),pick(['Cultist',slaver(),'Looter'])];
    case'Exordium Wildlife':return[pick(['Fungi','JawWorm']),pick([louse(),'SpikeM','AcidM'])];
    case'Gremlin Nob':return['Nob'];case'Lagavulin':return['Laga'];case'3 Sentries':return['Sentry','Sentry','Sentry'];
    case'The Guardian':return['Guardian'];case'Hexaghost':return['Hexa'];case'Slime Boss':return['SlimeBoss'];
    case'Mushrooms':return['Fungi','Fungi','Fungi'];}
  return['Cultist']}

<script>
/* ===================== map generation (MapGenerator + RoomTypeAssigner) ===================== */
class MNode{constructor(x,y){this.x=x;this.y=y;this.edges=[];this.parents=[];this.room=null;this.taken=false}
  get has(){return this.edges.length>0}
  addEdge(dx,dy){if(!this.edges.some(e=>e.dx===dx&&e.dy===dy)){this.edges.push({dx,dy});this.edges.sort((a,b)=>a.dx-b.dx)}}}
function ancestor(a,b,maxD){let l=a.x<b.y?a:b,r=a.x<b.y?b:a;for(let row=a.y;row>=0&&row>=a.y-maxD;row--){if(!l.parents.length||!r.parents.length)return null;
  l=l.parents.reduce((m,n)=>n.x>m.x?n:m);r=r.parents.reduce((m,n)=>n.x<m.x?n:m);if(l===r)return l}return null}
function mkPath(map,cur,rng){if(cur.y+1>=map.length){cur.addEdge(3,cur.y+2);return}
  const end=map[cur.y].length-1;let tx=cur.x+rng.random(cur.x===0?0:-1,cur.x===end?0:1);const ty=cur.y+1;let cand=map[ty][tx];
  for(const p of cand.parents){if(p===cur)continue;const an=ancestor(p,cur,5);if(an&&ty-an.y<3){
    if(cand.x>cur.x)tx=Math.max(0,cur.x+rng.random(-1,0));else if(cand.x===cur.x){tx=cur.x+rng.random(-1,1);if(tx>end)tx=cur.x-1;else if(tx<0)tx=cur.x+1}else tx=Math.min(end,cur.x+rng.random(0,1));cand=map[ty][tx]}}
  const L=map[cur.y][cur.x-1];if(L&&L.has)tx=Math.max(tx,L.edges[L.edges.length-1].dx);
  const R=map[cur.y][cur.x+1];if(R&&R.has)tx=Math.min(tx,R.edges[0].dx);
  cand=map[ty][tx];cur.addEdge(tx,ty);cand.parents.push(cur);mkPath(map,cand,rng)}
function generateMap(rng){const H=15,W=7,map=Array.from({length:H},(_,y)=>Array.from({length:W},(__,x)=>new MNode(x,y)));let first=-1;
  for(let p=0;p<6;p++){let s=rng.random(0,W-1);if(p===0)first=s;while(p===1&&s===first)s=rng.random(0,W-1);mkPath(map,map[0][s],rng)}
  const seen=new Set();for(const n of map[0])for(const e of [...n.edges]){const k=e.dx+','+e.dy;if(seen.has(k))n.edges.splice(n.edges.indexOf(e),1);seen.add(k)}
  const count=map.flat().filter(n=>n.has&&n.y!==H-2).length,rooms=[];
  for(const [t,c] of [['Shop',.05],['Rest',.12],['Elite',.08],['Event',.22]])for(let i=0;i<Math.round(f32(count*f32(c)));i++)rooms.push(t);
  for(const n of map[H-1])n.room='Rest';for(const n of map[0])n.room='Monster';for(const n of map[8])n.room='Treasure';
  const un=map.flat().filter(n=>n.has&&n.room===null);while(rooms.length<un.length)rooms.push('Monster');rng.shuffle(rooms);
  for(const n of un){const sib=n.parents.flatMap(p=>p.edges.map(e=>map[e.dy][e.dx]).filter(s=>s!==n));
    const i=rooms.findIndex(t=>{if(n.y<=4&&(t==='Rest'||t==='Elite'))return false;if(n.y>=13&&t==='Rest')return false;
      if(['Rest','Treasure','Shop','Elite'].includes(t)&&n.parents.some(p=>p.room===t))return false;
      return !['Rest','Monster','Event','Elite','Shop'].includes(t)||!sib.some(s=>s.room===t)});if(i>=0)n.room=rooms.splice(i,1)[0]}
  for(const n of un)n.room??='Monster';
  return map.map(row=>row.map(n=>({x:n.x,y:n.y,room:n.has?n.room:null,edges:n.edges.map(e=>({dx:e.dx,dy:e.dy,taken:false})),taken:false})))}

const CLS={
 R:{n:'赤甲',ep:'焚誓的战士',hp:80,relic:'EmberHeart',deck:[['R_Strike',5],['R_Defend',4],['Bash',1]],col:'#ff7a3d',
    desc:'身披重甲的老兵，靠力量与格挡硬碰硬。起始遗物<b>余烬之心</b>在每场战斗后回复生命。'},
 G:{n:'青影',ep:'伏匿的猎手',hp:70,relic:'ScaleRing',deck:[['G_Strike',5],['G_Defend',5],['Survivor',1],['Neutralize',1]],col:'#4FA3A0',
    desc:'擅长飞刀、毒药与弃牌循环的刺客。起始遗物<b>青鳞戒</b>让每场战斗的第一手多抽两张。'},
};
const STREAMS=['monster','event','merchant','card','treasure','relic','potion','monsterHp','ai','shuffle','cardRandom','misc','map'];
let G=null;
function newRun(cls,seed=newSeed()){
  const rng={};for(const s of STREAMS)rng[s]=new Rng(seed);rng.map=new Rng(BigInt.asIntN(64,seed+1n));
  const c=CLS[cls];G={cls,seed:seed.toString(),hp:c.hp,maxHp:c.hp,gold:99,deck:[],relics:[],potions:[null,null,null],floor:0,cur:null,rng,
    blizz:5,potMod:0,removeCost:75,evChance:{m:.1,s:.03,t:.02},events:Object.keys(EVENTS),
    stats:{kills:0,elites:0,dmg:0,gold:0,cards:0,start:Date.now(),bossesKilled:0},neowDone:false,lastRoom:null};
  for(const [id,n] of c.deck)for(let i=0;i<n;i++)G.deck.push(makeCard(id));
  G.relics.push({id:c.relic,counter:-1});
  G.enc=buildEncounters(rng.monster);
  const b=[...BOSSES];rng.monster.shuffle(b);G.boss=b[0];
  G.relicPool={};for(const t of ['COMMON','UNCOMMON','RARE']){G.relicPool[t]=rng.relic.shuffle(Object.keys(RELICS).filter(k=>RELICS[k].tier===t))}
  G.map=generateMap(rng.map);
  return G}
const hasRelic=id=>G&&G.relics.some(r=>r.id===id);
const relicOf=id=>G.relics.find(r=>r.id===id);
function flashRelic(id){const el=hud.querySelector(`.relic[data-id="${id}"]`);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
function gainGold(n,silent){if(n>0&&hasRelic('GoldenIdol')){n=Math.floor(n*1.25)}G.gold+=n;if(n>0){G.stats.gold+=n;if(!silent)SFX.play('coin')}renderHud();return n}
function healRun(n){if(n<=0)return;G.hp=Math.min(G.maxHp,G.hp+n);SFX.play('heal');renderHud()}
function maxHpRun(n){G.maxHp=Math.max(1,G.maxHp+n);if(n>0)G.hp+=n;G.hp=Math.min(G.hp,G.maxHp);renderHud()}
function damageRun(n){G.hp=Math.max(0,G.hp-n);SFX.play('hit');renderHud();view.classList.remove('shake');void view.offsetWidth;view.classList.add('shake');if(G.hp<=0)setTimeout(()=>gameOver(false),500)}
function addToDeck(c){G.deck.push(c);if(hasRelic('CeramicFish')){gainGold(9,true);flashRelic('CeramicFish')}renderHud()}
function addRelic(id){if(hasRelic(id))return;G.relics.push({id,counter:RELICS[id].counter??-1});
  if(id==='Strawberry')maxHpRun(7);if(id==='Pear')maxHpRun(10);renderHud();toast(`获得遗物「${RELICS[id].n}」`);SFX.play('buff')}
function rollTier(){const r=G.rng.relic.random(0,99);return r<50?'COMMON':r<83?'UNCOMMON':'RARE'}
function takeRelic(tier){const order=['COMMON','UNCOMMON','RARE'];let i=order.indexOf(tier);for(let k=0;k<3;k++){const p=G.relicPool[order[(i+k)%3]];while(p.length){const id=p.shift();if(!hasRelic(id))return id}}return'Anchor'}
function addPotion(id){const s=G.potions.indexOf(null);if(s<0){toast('药水栏已满');return false}G.potions[s]=id;renderHud();return true}
function randomPotion(rng=G.rng.potion){const roll=rng.random(0,99),rar=roll<65?'COMMON':roll<90?'UNCOMMON':'RARE';
  const ids=Object.keys(POTIONS).filter(k=>!POTIONS[k].only||POTIONS[k].only===G.cls);for(;;){const id=ids[rng.random(ids.length-1)];if(POTIONS[id].r===rar)return id}}
function cardReward(kind){const res=[],color=G.cls;
  for(let i=0;i<3;i++){const roll=G.rng.card.random(99)+G.blizz,rare=kind==='elite'?10:3;
    const rar=kind==='boss'||roll<rare?'RARE':roll<rare+(kind==='elite'?40:37)?'UNCOMMON':'COMMON';
    if(rar==='COMMON')G.blizz=Math.max(-40,G.blizz-1);else if(rar==='RARE')G.blizz=5;
    const pool=poolOf(color,rar);for(;;){const d=pool[G.rng.card.random(pool.length-1)];if(res.some(c=>c.id===d.id))continue;res.push(makeCard(d.id));break}}
  return res}
function transformCard(c){const pool=['COMMON','UNCOMMON','RARE'].flatMap(r=>poolOf(G.cls,r)).filter(d=>d.id!==c.id);const d=pool[G.rng.misc.random(pool.length-1)];return makeCard(d.id)}

/* ===================== save ===================== */
const SAVE_KEY='ember-spire:run';
const packCard=c=>[c.id,c.up,c.dmg];
const unpackCard=([id,up,dmg])=>{const c=makeCard(id,!!up);c.dmg=dmg;return c};
function saveRun(){if(!G)return;try{const s={...G,deck:G.deck.map(packCard),rng:Object.fromEntries(Object.entries(G.rng).map(([k,r])=>[k,r.state()]))};localStorage.setItem(SAVE_KEY,JSON.stringify(s))}catch{}}
function loadRun(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const s=JSON.parse(raw);s.deck=s.deck.map(unpackCard);s.rng=Object.fromEntries(Object.entries(s.rng).map(([k,v])=>[k,Rng.from(v)]));return s}catch{return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch{}}

const TIPS=new WeakMap();

let tipTarget=null;
stage.addEventListener('pointermove',e=>{let el=e.target;while(el&&el!==stage&&!TIPS.has(el))el=el.parentElement;
  if(!el||el===stage||!TIPS.has(el)){tipEl.classList.remove('on');tipTarget=null;return}
  tipTarget=el;const th=TIPS.get(el)();if(!th){tipEl.classList.remove('on');return}if(tipEl.innerHTML!==th)tipEl.innerHTML=th;
  const p=toStage(e);const w=tipEl.offsetWidth,hh=tipEl.offsetHeight;let x=p.x+18,y=p.y+14;if(x+w>1270)x=p.x-w-18;if(y+hh>712)y=712-hh;tipEl.style.left=x+'px';tipEl.style.top=Math.max(4,y)+'px';tipEl.classList.add('on')});

function hideTip(){tipEl.classList.remove('on');tipTarget=null}
const tipBox=(t,d)=>`<div class="tipbox"><b>${t}</b>${d}</div>`;
const KW={'消耗':'打出后移出本场战斗。','虚无':'回合结束时若仍在手牌中，将被消耗。','固有':'每场战斗开始时一定在起始手牌中。','飞刀':'0 费攻击牌：造成 4 点伤害，消耗。','伤口':'无法打出的状态牌。','晕眩':'无法打出，虚无。','易伤':'受到的攻击伤害增加 50%。','虚弱':'造成的攻击伤害降低 25%。','中毒':'回合开始时失去等同层数的生命，然后层数减 1。','力量':'每点力量使攻击伤害增加 1。','敏捷':'每点敏捷使卡牌提供的格挡增加 1。','格挡':'在下回合开始前抵挡伤害。','悔恨':'无法打出的诅咒牌。','伤痛':'无法打出的诅咒牌。','疑虑':'无法打出的诅咒牌。'};
function cardTips(c){const d=descRaw(c);const out=[];for(const k of Object.keys(KW))if(d.includes(k)&&!(c.n===k))out.push(tipBox(k,KW[k]));if(c.ex&&!d.includes('消耗'))out.push(tipBox('消耗',KW['消耗']));return out.slice(0,4).join('')}
function descRaw(c){const d=CARDS[c.id];return(c.up&&d.ud?d.ud:d.d)}
function descHtml(c,bctx){let s=descRaw(c);
  const num=(v,base)=>`<span class="n ${v>base?'hi':v<base?'lo':''}">${v}</span>`;
  const dm=bctx?bctx.cardDmg(c,bctx.target):baseDmg(c);const bl=bctx?bctx.cardBlk(c):c.blk;
  s=s.replace(/\{D\}/g,num(dm,c.dmg+(c.id==='PerfectedStrike'&&!bctx?0:0))).replace(/\{B\}/g,num(bl,c.blk)).replace(/\{M\}/g,num(c.mag,CARDS[c.id].mag));
  if(c.ex&&!/消耗/.test(s)&&CARDS[c.id].up.ex===undefined)s+=' <b>消耗</b>。';
  if(c.innate&&!/固有/.test(s))s='<b>固有</b>。'+s;
  return s}
function baseDmg(c){if(c.id==='PerfectedStrike')return c.dmg+c.mag*(G?G.deck.filter(x=>CARDS[x.id].tags&&CARDS[x.id].tags.includes('strike')).length:0);if(c.id==='BodySlam')return 0;return c.dmg}
const TYPE_CN={ATTACK:'攻击',SKILL:'技能',POWER:'能力',STATUS:'状态',CURSE:'诅咒'};
function renderCard(c,bctx){const d=CARDS[c.id];const cls={ATTACK:'',SKILL:'skill',POWER:'power',STATUS:'status',CURSE:'curse'}[c.type];
  const cost=c.cost===-2?'':(c.cost===-1?'X':(c.costTurn??c.cost));

  setTip(el,()=>cardTips(c));return el}
function refreshCardEl(el,c,bctx){const dt=el.querySelector('.dt'),nh=descHtml(c,bctx);if(dt.innerHTML!==nh)dt.innerHTML=nh;const co=el.querySelector('.cost');if(co&&c.cost!==-2)co.textContent=c.cost===-1?'X':(c.costTurn??c.cost);el.querySelector('.nm').textContent=cardName(c);el.classList.toggle('up',!!c.up)}

function gridSelect({cards,title,sub='',count=1,cancel=true,onDone,preview}){hideTip();
  const m=h(`<div class="modal"><h2>${title}</h2><div class="sub">${sub}</div><div class="grid"></div><div class="acts"></div></div>`);
  const grid=m.querySelector('.grid'),acts=m.querySelector('.acts');const sel=new Set();
  const confirm=h(`<button class="btn primary" ${count?'disabled':''}>${count?'确认':'关闭'}</button>`);
  cards.forEach(c=>{const slot=h('<div class="slot"></div>');let shown=c;const el=renderCard(c);slot.appendChild(el);grid.appendChild(slot);
    if(preview){el.addEventListener('pointerenter',()=>{const u={...c,uid:-1};upgradeCard(u);const pe=renderCard(u);pe.style.pointerEvents='none';pe.classList.add('pick');slot.appendChild(pe);el.style.opacity=0});
      el.addEventListener('pointerleave',()=>{slot.querySelectorAll('.card.pick').forEach(x=>x.remove());el.style.opacity=1})}
    if(count)el.addEventListener('click',()=>{SFX.play('click');if(sel.has(c)){sel.delete(c);el.classList.remove('sel')}else{if(sel.size>=count){const f=[...sel][0];sel.delete(f);grid.querySelector(`[data-uid="${f.uid}"]`)?.classList.remove('sel')}sel.add(c);el.classList.add('sel')}confirm.disabled=sel.size!==Math.min(count,cards.length)})});
  if(!cards.length)grid.appendChild(h('<div style="color:var(--muted);margin-top:80px">这里没有牌。</div>'));
  confirm.addEventListener('click',()=>{m.remove();hideTip();onDone&&onDone([...sel])});acts.appendChild(confirm);
  if(count&&cancel){const cb=h('<button class="btn">取消</button>');cb.addEventListener('click',()=>{m.remove();hideTip();onDone&&onDone(null)});acts.appendChild(cb)}
  if(count&&!cancel&&cards.length===0){confirm.disabled=false}
  ov.appendChild(m);return m}

  <span class="relics">${G.relics.map(r=>`<span class="relic" data-id="${r.id}">${relicIcon(r.id)}${r.counter>=0&&['HappyFlower','PenNib'].includes(r.id)?`<span class="cnt">${r.counter}</span>`:''}</span>`).join('')}</span>

  $('#hDeck').addEventListener('click',()=>gridSelect({cards:[...G.deck].sort((a,b)=>'ASPXC'.indexOf(a.type[0])-'ASPXC'.indexOf(b.type[0])),title:'牌组',sub:`共 ${G.deck.length} 张`,count:0}));

function potionMenu(i,el){const id=G.potions[i];$$('.potmenu').forEach(x=>x.remove());if(!id)return;const p=POTIONS[id];

  init(){this.ctx=this.cv.getContext('2d');for(let i=0;i<70;i++)this.embers.push(this.spawn(true));requestAnimationFrame(t=>this.loop(t))},
  spawn(any){return{x:Math.random()*1280,y:any?Math.random()*720:730,v:12+Math.random()*30,r:.6+Math.random()*2,ph:Math.random()*6,a:.3+Math.random()*.6}},
  base(mode){if(this.cache[mode])return this.cache[mode];const c=document.createElement('canvas');c.width=1280;c.height=720;const x=c.getContext('2d');

      x.fillStyle='#0a0c10';x.beginPath();x.moveTo(560,720);x.lineTo(600,260);x.lineTo(620,250);x.lineTo(630,120);x.lineTo(640,40);x.lineTo(650,120);x.lineTo(660,250);x.lineTo(680,260);x.lineTo(720,720);x.fill();

function howTo(){const m=h(`<div class="modal" style="justify-content:center"><div class="panel" style="width:720px;padding:26px 32px;font-size:15px;line-height:1.9;color:#d9cfbb">
 <h2 style="margin-top:0">玩法说明</h2>
 <p style="margin:0 0 8px">从地图底部出发，一路向上走到第 15 层，击败顶端的首领即可通关。每一层可以选择与当前房间相连的节点。</p>

function neowScreen(){setScreen('neow','title');const r=G.rng.misc;
  const a=r.pick([['remove','从牌组中移除一张牌'],['upgrade','升级一张牌'],['transform','变化一张牌']]);
  const b=r.pick([['maxhp',`最大生命 +${Math.floor(G.maxHp*.1)}`],['gold','获得 100 金币'],['relic','获得一件随机普通遗物']]);
  const c=[['rare','<span class="r">失去 10% 最大生命</span>，获得一张稀有卡（三选一）']];
  const d=[['potion','获得 3 瓶随机药水']];
  const opts=[a,b,c[0],d[0]];
  const s=h(`<div class="screen"><div class="event" style="width:980px"><div class="pic">${EVART.shrine()}</div><div class="txt"><h2>余烬祭坛</h2>
   <p>塔脚下有一座将熄的火坛，余烬在你靠近时重新亮了起来。一个低沉的声音从火里传出：「又一个要登塔的人。拿走一样东西吧，路上用得着。」</p><div class="opts" style="display:flex;flex-direction:column;gap:10px;margin-top:6px"></div></div></div></div>`);
  const box=s.querySelector('.opts');
  const done=()=>{G.neowDone=true;mapScreen()};
  for(const [k,t] of opts){const b=h(`<button class="opt"><b>[${k==='rare'?'交换':'祝福'}]</b>${t}</button>`);b.addEventListener('click',()=>{SFX.play('click');
    if(k==='remove')gridSelect({cards:G.deck,title:'移除一张牌',count:1,cancel:false,onDone:x=>{if(x&&x[0])G.deck.splice(G.deck.indexOf(x[0]),1);done()}});
    else if(k==='upgrade')gridSelect({cards:G.deck.filter(canUpgrade),title:'升级一张牌',count:1,cancel:false,preview:true,onDone:x=>{if(x&&x[0])upgradeCard(x[0]);done()}});
    else if(k==='transform')gridSelect({cards:G.deck,title:'变化一张牌',count:1,cancel:false,onDone:x=>{if(x&&x[0]){const i=G.deck.indexOf(x[0]);G.deck[i]=transformCard(x[0]);toast(`变成了「${cardName(G.deck[i])}」`)}done()}});

    else if(k==='gold'){gainGold(100);done()}

    else if(k==='rare'){maxHpRun(-Math.floor(G.maxHp*.1));const cs=[];const pool=poolOf(G.cls,'RARE');while(cs.length<3){const d=pool[G.rng.card.random(pool.length-1)];if(!cs.some(x=>x.id===d.id))cs.push(makeCard(d.id))}pickCard(cs,done,false)}
    else if(k==='potion'){for(let i=0;i<3;i++)addPotion(randomPotion());done()}});box.appendChild(b)}
  view.appendChild(s)}

/* ---------- map ---------- */
const ROOM_INFO={Monster:['敌人','#c9bfae'],Elite:['精英','#ff7a3d'],Rest:['篝火','#7CCB5B'],Shop:['商店','#E7C274'],Event:['未知','#9fb8d9'],Treasure:['宝箱','#d9a441'],Boss:['首领','#ff4a2a']};
function roomGlyph(t,c,s=1){const S=v=>v*s;switch(t){
 case'Monster':return`<path d="M${S(-8)} ${S(8)} L0 ${S(-9)} L${S(8)} ${S(8)} Z" fill="${c}"/><circle cx="${S(-3)}" cy="${S(2)}" r="${S(1.6)}" fill="#1a1510"/><circle cx="${S(3)}" cy="${S(2)}" r="${S(1.6)}" fill="#1a1510"/>`;
 case'Elite':return`<path d="M${S(-10)} ${S(7)} L${S(-10)} ${S(-4)} L${S(-5)} ${S(1)} L0 ${S(-10)} L${S(5)} ${S(1)} L${S(10)} ${S(-4)} L${S(10)} ${S(7)} Z" fill="${c}"/>`;
 case'Rest':return`<path d="M0 ${S(-10)} C${S(7)} ${S(-3)} ${S(8)} ${S(2)} ${S(4)} ${S(8)} L${S(-4)} ${S(8)} C${S(-8)} ${S(2)} ${S(-7)} ${S(-3)} 0 ${S(-10)} Z" fill="${c}"/>`;
 case'Shop':return`<circle r="${S(8)}" fill="none" stroke="${c}" stroke-width="${S(2.6)}"/><text y="${S(4.5)}" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="${S(13)}" fill="${c}">G</text>`;
 case'Event':return`<text y="${S(7)}" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="900" font-size="${S(21)}" fill="${c}">?</text>`;
 case'Treasure':return`<rect x="${S(-9)}" y="${S(-6)}" width="${S(18)}" height="${S(13)}" rx="${S(2)}" fill="${c}"/><rect x="${S(-9)}" y="${S(-2)}" width="${S(18)}" height="${S(2)}" fill="#1a1510"/>`;
 case'Boss':return`<path d="M${S(-16)} ${S(10)} L${S(-16)} ${S(-6)} L${S(-8)} ${S(2)} L0 ${S(-16)} L${S(8)} ${S(2)} L${S(16)} ${S(-6)} L${S(16)} ${S(10)} Z" fill="${c}"/>`}}
const mapPos=(x,y)=>{const j=(k)=>((Math.sin(x*12.9898+y*78.233+k*3.1)*43758.5453)%1+1)%1;return[430+x*70+(j(1)-.5)*22,1150-y*68+(j(2)-.5)*18]};
function availableNodes(){if(!G.cur)return G.map[0].filter(n=>n.room);const n=G.map[G.cur.y][G.cur.x];if(G.cur.y===14)return['boss'];return n.edges.map(e=>G.map[e.dy][e.dx])}
function mapScreen(peek=false){if(!peek){setScreen('map','map');saveRun()}
  const av=peek?[]:availableNodes();
  const wrap=h(`<div id="mapScroll"><div id="mapInner"><div class="mapsheet"></div></div></div>`);const inner=wrap.querySelector('#mapInner');
  let svg=`<svg width="1280" height="1240" style="position:absolute;left:0;top:0">`;
  for(const row of G.map)for(const n of row){if(!n.room)continue;const [x1,y1]=mapPos(n.x,n.y);
    for(const e of n.edges){let x2,y2;if(e.dy>=15){x2=640;y2=90}else[x2,y2]=mapPos(e.dx,e.dy);const tk=e.taken;
      const len=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/len,uy=(y2-y1)/len;
      svg+=`<line x1="${x1+ux*16}" y1="${y1+uy*16}" x2="${x2-ux*(e.dy>=15?34:16)}" y2="${y2-uy*(e.dy>=15?34:16)}" stroke="${tk?'#ff7a3d':'rgba(214,196,160,.35)'}" stroke-width="${tk?3:2}" stroke-dasharray="${tk?'none':'2 7'}" stroke-linecap="round"/>`}}
  for(const row of G.map)for(const n of row){if(!n.room)continue;const [x,y]=mapPos(n.x,n.y);const [nm,c]=ROOM_INFO[n.room];const isAv=av.includes(n);const isCur=G.cur&&G.cur.x===n.x&&G.cur.y===n.y;
    svg+=`<g class="mnode ${isAv?'av':''}" data-x="${n.x}" data-y="${n.y}" transform="translate(${x} ${y})">${isAv?`<circle class="ring" r="20" fill="none" stroke="${c}" stroke-width="2"/>`:''}<circle r="15" fill="${n.taken||isCur?'#3a2a20':'#1a1612'}" stroke="${isCur?'#ff7a3d':n.taken?'#7a5a3a':'rgba(214,196,160,.2)'}" stroke-width="${isCur?3:1.5}"/><g class="ic" opacity="${n.taken&&!isCur?.45:1}">${roomGlyph(n.room,c)}</g></g>`}
  const bAv=av.includes('boss');
  svg+=`<g class="mnode ${bAv?'av':''}" data-boss="1" transform="translate(640 90)">${bAv?`<circle class="ring" r="44" fill="none" stroke="#ff4a2a" stroke-width="2"/>`:''}<circle r="38" fill="#1a1210" stroke="#ff4a2a" stroke-width="2"/><g class="ic">${roomGlyph('Boss','#ff4a2a',1.2)}</g></g><text x="640" y="152" text-anchor="middle" font-family="Noto Serif SC" font-weight="900" font-size="18" fill="#efe6d2">${ENC_NAME[G.boss]}</text></svg>`;
  inner.insertAdjacentHTML('beforeend',svg);
  const leg=h(`<div class="maplegend">${Object.entries(ROOM_INFO).filter(([k])=>k!=='Boss').map(([k,[n,c]])=>`<div><svg viewBox="-12 -12 24 24">${roomGlyph(k,c)}</svg>${n}</div>`).join('')}</div>`);
  const info=h(`<div class="mapinfo"><h3>第一幕 · 余烬回廊</h3>种子 <span style="font-family:var(--num);font-size:16px;color:var(--paper)">${seedStr(BigInt(G.seed))}</span><br>首领：${ENC_NAME[G.boss]}<br>${peek?'<span style="color:var(--gold)">正在查看地图</span>':av.length?'点击发光的节点前进。':''}</div>`);
  const host=peek?null:view;
  if(peek){const m=h('<div class="modal" style="padding:0"></div>');m.appendChild(wrap);m.append(leg,info);const cb=h('<button class="btn" style="position:absolute;right:30px;bottom:24px;z-index:3">返回</button>');cb.addEventListener('click',()=>m.remove());m.appendChild(cb);ov.appendChild(m)}
  else{view.appendChild(wrap);view.append(leg,info)}
  $$('.mnode',inner).forEach(g=>{const isB=g.dataset.boss;const n=isB?null:G.map[+g.dataset.y][+g.dataset.x];
    setTip(g,()=>isB?tipBox('首领',ENC_NAME[G.boss]):tipBox(`第 ${n.y+1} 层 · ${ROOM_INFO[n.room][0]}`,{Monster:'普通战斗。',Elite:'强敌，胜利后获得遗物。',Rest:'休息回复生命，或升级一张牌。',Shop:'购买卡牌、遗物与药水，或移除卡牌。',Event:'可能是事件，也可能是战斗、商店或宝箱。',Treasure:'打开宝箱获得遗物。'}[n.room]));
    if(g.classList.contains('av'))g.addEventListener('click',()=>{SFX.play('click');enterNode(isB?'boss':n)})});
  const cy=G.cur?mapPos(0,G.cur.y)[1]:1150;wrap.scrollTop=Math.max(0,cy-420)}
function peekMap(){mapScreen(true)}
function enterNode(n){if(n==='boss'){G.cur={x:-1,y:15};G.floor++;reseedFloor();G.lastRoom='Boss';startBattle(G.boss,'boss');return}
  if(G.cur){const p=G.map[G.cur.y][G.cur.x];p.taken=true;const e=p.edges.find(e=>e.dx===n.x&&e.dy===n.y);if(e)e.taken=true}
  n.taken=true;G.cur={x:n.x,y:n.y};G.floor++;reseedFloor();let room=n.room;
  if(room==='Event'){const ch=G.evChance,r=G.rng.event.randomFloat();let res='Event';if(r<ch.m)res='Monster';else if(r<ch.m+ch.s)res='Shop';else if(r<ch.m+ch.s+ch.t)res='Treasure';
    ch.m=res==='Monster'?.1:ch.m+.1;ch.s=res==='Shop'?.03:ch.s+.03;ch.t=res==='Treasure'?.02:ch.t+.02;room=res==='Event'?'EventRoom':res;if(res!=='Event')toast('问号房间里是……'+ROOM_INFO[res][0])}
  G.lastRoomPrev=G.lastRoom;G.lastRoom=room;
  if(room==='Monster')startBattle(G.enc.normal.shift()||'Cultist','normal');
  else if(room==='Elite')startBattle(G.enc.elite.shift()||'Gremlin Nob','elite');
  else if(room==='Rest')restScreen();else if(room==='Shop')shopScreen();else if(room==='Treasure')treasureScreen();else eventScreen()}
function reseedFloor(){for(const s of ['monsterHp','ai','shuffle','cardRandom','misc'])G.rng[s]=new Rng(BigInt.asIntN(64,BigInt(G.seed)+BigInt(G.floor)))}

function rewardsScreen(list,onDone){setScreen('reward','battle');
  const s=h(`<div class="screen"><div class="panel rewards"><h2>战利品</h2><div class="list" style="display:flex;flex-direction:column;gap:10px"></div><button class="btn" style="margin-top:8px" id="skip">继续前进</button></div></div>`);
  const L=s.querySelector('.list');
  for(const r of list){let el;
    if(r.type==='gold'){el=h(`<button class="rw">${IC.gold}<span>${r.amount} 金币${r.stolen?'（被偷走的）':''}</span></button>`);el.addEventListener('click',()=>{gainGold(r.amount);el.classList.add('got')})}
    else if(r.type==='potion'){el=h(`<button class="rw">${potIcon(r.id,30)}<span>${POTIONS[r.id].n}</span></button>`);setTip(el,()=>tipBox(POTIONS[r.id].n,POTIONS[r.id].d));el.addEventListener('click',()=>{if(addPotion(r.id)){el.classList.add('got');SFX.play('click')}})}
    else if(r.type==='relic'){el=h(`<button class="rw">${relicIcon(r.id,30)}<span>${RELICS[r.id].n}</span></button>`);setTip(el,()=>tipBox(RELICS[r.id].n,RELICS[r.id].d));el.addEventListener('click',()=>{addRelic(r.id);el.classList.add('got')})}
    else if(r.type==='card'){el=h(`<button class="rw">${IC.deck.replace('<svg','<svg width="30"')}<span>将一张牌加入牌组</span></button>`);el.addEventListener('click',()=>pickCard(r.cards,ok=>{if(ok)el.classList.add('got')},true))}

function pickCard(cards,cb,canSkip=true){hideTip();const m=h(`<div class="modal" style="justify-content:center"><h2>选择一张牌</h2><div class="sub">加入你的牌组</div><div class="choice-row"></div><div class="acts"></div></div>`);
  const row=m.querySelector('.choice-row');
  cards.forEach(c=>{const slot=h('<div class="slot"></div>');const el=renderCard(c);slot.appendChild(el);row.appendChild(slot);el.addEventListener('click',()=>{m.remove();hideTip();addToDeck(c);SFX.play('card');toast(`「${cardName(c)}」加入了牌组`);cb(true)})});
  if(canSkip){const sk=h('<button class="btn">跳过</button>');sk.addEventListener('click',()=>{m.remove();hideTip();cb(false)});m.querySelector('.acts').appendChild(sk)}
  ov.appendChild(m)}

function eventScreen(forced){setScreen('event','plain');let id=forced;
  if(!id){if(!G.events.length)G.events=Object.keys(EVENTS);id=G.events.splice(G.rng.event.random(G.events.length-1),1)[0]}
  const ev=EVENTS[id];
  const s=h(`<div class="screen"><div class="event"><div class="pic">${EVART[ev.art]()}</div><div class="txt"><h2>${ev.n}</h2><p class="body"></p><div class="opts" style="display:flex;flex-direction:column;gap:10px;margin-top:6px"></div></div></div></div>`);
  const body=s.querySelector('.body'),opts=s.querySelector('.opts');view.appendChild(s);
  const E={G,rng:G.rng.event,
    page(t,os){body.innerHTML=t;opts.innerHTML='';for(const o of os){const b=h(`<button class="opt" ${o.dis?'disabled':''}><b>[${o.t}]</b>${o.d}</button>`);b.addEventListener('click',()=>{SFX.play('click');o.f()});opts.appendChild(b)}},
    end(t){E.page(t,[{t:'离开',d:'',f:()=>mapScreen()}])},
    relic(id){addRelic(id)},randomRelic(){addRelic(takeRelic(rollTier()))},card(id){addToDeck(makeCard(id));toast(`获得「${CARDS[id].n}」`)},
    heal(n){healRun(n)},damage(n){damageRun(n)},maxHp(n){maxHpRun(n)},gold(n){n>0?gainGold(n):(G.gold+=n,renderHud())},toast,
    remove(cb){gridSelect({cards:G.deck,title:'移除一张牌',count:1,cancel:false,onDone:x=>{if(x&&x[0])G.deck.splice(G.deck.indexOf(x[0]),1);renderHud();cb()}})},
    upgrade(cb){gridSelect({cards:G.deck.filter(canUpgrade),title:'升级一张牌',count:1,cancel:false,preview:true,onDone:x=>{if(x&&x[0])upgradeCard(x[0]);cb()}})},
    transform(cb){gridSelect({cards:G.deck,title:'变化一张牌',count:1,cancel:false,onDone:x=>{if(x&&x[0]){const i=G.deck.indexOf(x[0]);G.deck[i]=transformCard(x[0]);toast(`变成了「${cardName(G.deck[i])}」`)}cb()}})},
    fight(key){startBattle(key,'event',{relic:true})}};
  ev.start(E)}

   <div class="rest"><button class="opt2" id="rR">${`<svg viewBox="0 0 80 80"><path d="M14 50 Q40 30 66 50 L66 62 L14 62Z" fill="#4a3a6a"/><circle cx="26" cy="44" r="8" fill="#e8d4b0"/><path d="M50 18 h8 l-8 8 h8" stroke="#a89f8c" stroke-width="3" fill="none"/></svg>`}<b>休息</b><span>回复 ${heal} 点生命</span></button>
   <button class="opt2" id="rS"><svg viewBox="0 0 80 80"><rect x="12" y="50" width="56" height="12" rx="3" fill="#6a7282"/><path d="M20 50 L28 36 L52 36 L60 50Z" fill="#8a92a0"/><rect x="44" y="10" width="8" height="30" rx="2" fill="#5a3a22" transform="rotate(35 48 25)"/><rect x="30" y="8" width="24" height="12" rx="3" fill="#b9c2cc" transform="rotate(35 42 14)"/><circle cx="40" cy="30" r="3" fill="#ffd27a"/></svg><b>锻造</b><span>升级一张牌</span></button></div></div>`);
  s.querySelector('#rR').addEventListener('click',()=>{healRun(heal);toast(`回复了 ${heal} 点生命`);setTimeout(mapScreen,600)});
  s.querySelector('#rS').addEventListener('click',()=>gridSelect({cards:G.deck.filter(canUpgrade),title:'锻造',sub:'选择一张牌升级',count:1,preview:true,onDone:x=>{if(x&&x[0]){upgradeCard(x[0]);SFX.play('block');toast(`「${cardName(x[0])}」已升级`);setTimeout(mapScreen,500)}}}));
  view.appendChild(s)}

/* ---------- treasure ---------- */
function treasureScreen(){setScreen('treasure','plain');const r=G.rng.treasure;const roll=r.random(99),size=roll<50?'S':roll<83?'M':'L';
  const tr=r.random(99);const tier=size==='S'?(tr<75?'COMMON':'UNCOMMON'):size==='M'?(tr<35?'COMMON':tr<85?'UNCOMMON':'RARE'):(tr<75?'UNCOMMON':'RARE');

  const ch=s.querySelector('#chest');ch.addEventListener('pointerenter',()=>ch.style.transform='scale(1.05)');ch.addEventListener('pointerleave',()=>ch.style.transform='');
  ch.addEventListener('click',()=>{SFX.play('coin');const list=[{type:'relic',id:takeRelic(tier)}];if(gold)list.unshift({type:'gold',amount:gold});rewardsScreen(list,mapScreen)},{once:true});
  view.appendChild(s)}

/* ---------- shop ---------- */
function shopScreen(){setScreen('shop','plain');const r=G.rng.merchant;const disc=()=>hasRelic('Membership')?.5:1;
  const rar=()=>{const x=r.random(99);return x<9?'RARE':x<46?'UNCOMMON':'COMMON'};
  const pickT=(type,taken)=>{for(let k=0;k<50;k++){const rr=rar();const pool=poolOf(G.cls,rr).filter(d=>d.type===type&&!taken.includes(d.id));if(pool.length)return pool[r.random(pool.length-1)]}return poolOf(G.cls,'COMMON').find(d=>d.type===type)};
  const taken=[],cards=[];for(const t of ['ATTACK','ATTACK','SKILL','SKILL','POWER']){const d=pickT(t,taken);taken.push(d.id);const base={COMMON:50,UNCOMMON:75,RARE:150}[d.rarity];cards.push({c:makeCard(d.id),price:Math.round(base*r.randomFloat(.9,1.1)),sold:false})}
  cards[r.random(4)].sale=true;
  const relics=[];for(let i=0;i<3;i++){let id=i===2?(hasRelic('Membership')?takeRelic(rollTier()):'Membership'):takeRelic(rollTier());const t=RELICS[id].tier;relics.push({id,price:Math.round(({COMMON:150,UNCOMMON:250,RARE:300,SHOP:150})[t]*r.randomFloat(.95,1.05)),sold:false})}
  const pots=[];for(let i=0;i<3;i++){const id=randomPotion(r);pots.push({id,price:Math.round(({COMMON:50,UNCOMMON:75,RARE:100})[POTIONS[id].r]*r.randomFloat(.95,1.05)),sold:false})}
  const fin=p=>Math.round(p*disc());
  const render=()=>{view.innerHTML='';
    const s=h(`<div class="screen" style="justify-content:flex-start;padding-top:26px"><div style="display:flex;align-items:baseline;gap:16px;width:1180px;margin-bottom:18px"><span style="font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:.15em">商店</span><span style="color:var(--muted)">「看中什么就拿，钱放桌上。」</span><button class="btn sm" id="leave" style="margin-left:auto">离开商店</button></div><div class="shop"><div class="cards"></div><div class="side"></div></div></div>`);
    const cw=s.querySelector('.cards'),side=s.querySelector('.side');
    cards.forEach(it=>{const p=fin(it.sale?Math.round(it.price/2):it.price);const el=h(`<div class="item" style="${it.sold?'opacity:.25;pointer-events:none':''}"><div class="slot"></div><div class="price ${G.gold<p?'no':''}">${IC.gold.replace('<svg','<svg width="20"')}${p}${it.sale?` <s>${fin(it.price)}</s>`:''}</div></div>`);
      const ce=renderCard(it.c);el.querySelector('.slot').appendChild(ce);if(it.sale)el.querySelector('.slot').appendChild(h('<div style="position:absolute;right:-8px;top:-10px;background:#d9453b;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;z-index:2">特价</div>'));
      ce.addEventListener('click',()=>{if(G.gold<p){toast('金币不够');return}G.gold-=p;it.sold=true;addToDeck(it.c);SFX.play('coin');render()});cw.appendChild(el)});
    const row=(icon,name,sub,price,sold,buy,tip)=>{const el=h(`<div class="srow ${sold?'sold':''}"><div class="i">${icon}</div><div class="n">${name}<small>${sub}</small></div><div class="price ${G.gold<price?'no':''}">${IC.gold.replace('<svg','<svg width="18"')}${price}</div></div>`);
      if(tip)setTip(el,tip);el.addEventListener('click',()=>{if(G.gold<price){toast('金币不够');return}buy(price)});side.appendChild(el)};
    side.appendChild(h('<div style="color:var(--muted);font-size:13px;letter-spacing:.2em">遗物</div>'));
    relics.forEach(it=>row(relicIcon(it.id,40),RELICS[it.id].n,RELICS[it.id].d,fin(it.price),it.sold,p=>{G.gold-=p;it.sold=true;addRelic(it.id);render()}));
    side.appendChild(h('<div style="color:var(--muted);font-size:13px;letter-spacing:.2em;margin-top:6px">药水</div>'));
    pots.forEach(it=>row(potIcon(it.id,34),POTIONS[it.id].n,POTIONS[it.id].d,fin(it.price),it.sold,p=>{if(G.potions.indexOf(null)<0){toast('药水栏已满');return}G.gold-=p;it.sold=true;addPotion(it.id);SFX.play('coin');render()}));
    side.appendChild(h('<div style="color:var(--muted);font-size:13px;letter-spacing:.2em;margin-top:6px">服务</div>'));
    row(`<svg viewBox="0 0 40 40" width="36"><rect x="10" y="6" width="20" height="28" rx="3" fill="#3a3f4c" stroke="#efe6d2"/><path d="M6 6 L34 34" stroke="#d9453b" stroke-width="3"/></svg>`,'移除卡牌','从牌组中移除一张牌',fin(G.removeCost),G.removedHere,p=>gridSelect({cards:G.deck,title:'移除一张牌',count:1,onDone:x=>{if(!x||!x[0])return;G.gold-=p;G.deck.splice(G.deck.indexOf(x[0]),1);G.removeCost+=25;G.removedHere=true;SFX.play('coin');renderHud();render()}}));
    s.querySelector('#leave').addEventListener('click',()=>{G.removedHere=false;mapScreen()});view.appendChild(s);renderHud()};
  render()}

/* ---------- end ---------- */
function gameOver(win){clearSave();const st=G.stats;const mins=Math.max(1,Math.round((Date.now()-st.start)/60000));
  const score=G.floor*5+st.kills*2+st.elites*10+st.bossesKilled*50+Math.floor(st.gold/10);
  setScreen('end',win?'title':'plain');
  const s=h(`<div class="screen"><div style="font-family:var(--serif);font-weight:900;font-size:64px;letter-spacing:.2em;color:${win?'var(--gold)':'#d9453b'}">${win?'登顶':'倒下'}</div>
   <div style="color:var(--muted);margin-top:6px">${win?`你击败了${ENC_NAME[G.boss]}，第一幕的火焰为你熄灭。`:`你倒在了第 ${G.floor} 层。`}</div>
   <div class="stats"><span>到达层数</span><b>${G.floor}</b><span>击败敌人</span><b>${st.kills}</b><span>击败精英</span><b>${st.elites}</b><span>累计伤害</span><b>${st.dmg}</b><span>打出卡牌</span><b>${st.cards}</b><span>获得金币</span><b>${st.gold}</b><span>用时</span><b>${mins} 分钟</b><span style="color:var(--paper)">得分</span><b style="color:var(--ember)">${score}</b></div>
   <button class="btn primary">返回标题</button></div>`);
  s.querySelector('button').addEventListener('click',titleScreen);view.appendChild(s);hud.hidden=true;if(win)SFX.play('win')}
</script>
<script>
/* ===================== combat math (Combatant.ts) ===================== */
const pw=(a,k)=>a&&a.powers?(a.powers[k]||0):0;
function normalDamage(base,src,tgt,strMult=1){let d=f32(base+pw(src,'str')*strMult);d=f32(d+pw(src,'vigor'));
  if(pw(src,'weak')>0)d=f32(d*.75);if(pw(src,'penNib')>0)d=f32(d*2);
  if(tgt){if(pw(tgt,'vuln')>0)d=f32(d*1.5);if(pw(tgt,'intang')>0&&d>1)d=1}return Math.max(0,Math.floor(d))}
function normalBlock(base,a){let b=f32(base+pw(a,'dex'));if(pw(a,'frail')>0)b=f32(b*.75);return Math.max(0,Math.floor(b))}
const blockVal=base=>window.B?normalBlock(base,B.P):base;
const isDebuff=(k,amt)=>(k==='str'||k==='dex')?amt<0:PW[k]&&PW[k][1]==='debuff';

/* ===================== battle ===================== */
window.B=null;
function startBattle(key,kind,opts={}){setScreen('battle','battle');window.B=new Battle(key,kind,opts);B.begin()}
class Battle{
  constructor(key,kind,opts){this.key=key;this.kind=kind;this.opts=opts;this.active=true;this.q=[];this.cardQ=[];this.buf=null;this.wait=0;this.phase='start';this.turn=0;this.selecting=null;this.over=false;
    this.P={isP:true,hp:G.hp,maxHp:G.maxHp,block:0,powers:{},just:{}};this.monsters=[];this.draw=[];this.hand=[];this.discard=[];this.exhaust=[];this.energy=0;this.maxEnergy=3;
    this.attacksTurn=0;this.skillsTurn=0;this.cardsTurn=0;this.rc={};this.els=new Map();this.hover=null;this.drag=null;this.targeting=null;this.A=this.api();this.t0=0}
  /* ---------- queue ---------- */
  add(fn,dur=0){const a={fn,dur};if(this.buf)this.buf.push(a);else this.q.push(a)}
  group(fn){const prev=this.buf;this.buf=[];try{fn()}catch(e){console.error(e)}const g=this.buf;this.buf=prev;if(prev)prev.push(...g);else this.q.unshift(...g)}
  loop(){this.timer=setInterval(()=>{if(!this.active){clearInterval(this.timer);return}const t=performance.now();const dt=Math.min(.05,(t-(this.t0||t))/1000);this.t0=t;this.tick(dt)},16)}
  tick(dt){if(this.selecting)return;if(this.wait>0){this.wait-=dt;return}
    for(let i=0;i<60;i++){if(this.selecting||this.wait>0||!this.active||this.over)return;const a=this.q.shift()??this.cardQ.shift();
      if(!a){this.idle();return}this.group(a.fn);this.wait=Math.max(this.wait,a.dur||0);this.checkDeaths();this.refresh()}}
  get busy(){return this.q.length>0||this.cardQ.length>0||this.wait>0||!!this.selecting}
  idle(){if(this.phase==='player'){if(!this.hand.length&&hasRelic('UnceasingTop')&&(this.draw.length||this.discard.length)&&!pw(this.P,'noDraw')){flashRelic('UnceasingTop');this.add(()=>this.drawCards(1),.1);return}}this.refresh()}
  alive(){return this.monsters.filter(m=>!m.dead)}
  /* ---------- setup ---------- */
  begin(){const ids=encounterIds(this.key,G.rng.misc);ids.forEach((id,i)=>this.spawn(id,i));this.layoutMonsters(true);
    this.buildUI();
    const deck=G.deck.map(c=>{const x={...c};x.costTurn=null;return x});G.rng.shuffle.shuffle(deck);
    const inn=deck.filter(c=>c.innate);this.draw=[...deck.filter(c=>!c.innate),...inn];
    this.monsters.forEach(m=>{m.move=this.roll(m)});
    const A=this.A,P=this.P;
    if(hasRelic('Anchor')){flashRelic('Anchor');A.gainBlockRaw(10)}
    if(hasRelic('Vajra')){flashRelic('Vajra');A.pow(P,'str',1)}
    if(hasRelic('SmoothStone')){flashRelic('SmoothStone');A.pow(P,'dex',1)}
    if(hasRelic('BronzeScales')){flashRelic('BronzeScales');A.pow(P,'thorns',3)}
    if(hasRelic('Akabeko')){flashRelic('Akabeko');A.pow(P,'vigor',8)}
    if(hasRelic('BloodVial')){flashRelic('BloodVial');A.heal(2)}
    if(hasRelic('Marbles')){flashRelic('Marbles');A.powAll('vuln',1)}
    this.add(()=>this.startTurn());
    if(this.kind==='boss')banner(ENC_NAME[this.key]);else if(this.kind==='elite')banner('精英');
    this.loop()}
  spawn(id,i,hp){const d=MON[id];const r=G.rng.monsterHp;const mhp=hp??r.random(d.hp[0],d.hp[1]);
    const m={id,def:d,n:d.n,hp:mhp,maxHp:hp??mhp,block:0,powers:{},just:{},hist:[],idx:i,dead:false,uid:UID++};d.init&&d.init(m,r);this.monsters.push(m);return m}
  roll(m){const r=G.rng.ai;const mvv=m.def.roll(m,r,this.A);return mvv}
  /* ---------- turn flow ---------- */
  startTurn(){const P=this.P,A=this.A;this.turn++;this.phase='enemy';this.attacksTurn=this.skillsTurn=this.cardsTurn=0;this.rc={atk:0,skl:0};
    if(pw(P,'barricade')){}else if(pw(P,'blur')>0){P.powers.blur--;if(!P.powers.blur)delete P.powers.blur}else if(P.block){P.block=0}
    this.energy=(hasRelic('IceCream')?this.energy:0)+this.maxEnergy;if(hasRelic('IceCream')&&this.turn>1)flashRelic('IceCream');
    if(this.turn===1&&hasRelic('Lantern')){flashRelic('Lantern');this.energy++}
    const hf=relicOf('HappyFlower');if(hf){hf.counter=(hf.counter+1)%3;if(hf.counter===0){flashRelic('HappyFlower');this.energy++}renderHud()}
    if(pw(P,'energized')){this.energy+=P.powers.energized;delete P.powers.energized}
    delete P.powers.noDraw;
    if(pw(P,'nextBlk')){const b=P.powers.nextBlk;delete P.powers.nextBlk;A.gainBlockRaw(b)}
    if(this.turn===2&&hasRelic('HornCleat')){flashRelic('HornCleat');A.gainBlockRaw(14)}
    if(pw(P,'demon'))A.pow(P,'str',P.powers.demon);
    if(pw(P,'fumes'))A.powAll('poison',P.powers.fumes);
    let n=5;if(this.turn===1&&hasRelic('ScaleRing')){flashRelic('ScaleRing');n+=2}if(pw(P,'drawNext')){n+=P.powers.drawNext;delete P.powers.drawNext}
    A.draw(n);
    if(pw(P,'blades'))for(let i=0;i<P.powers.blades;i++)A.add(makeCard('Shiv'),'hand');
    this.add(()=>{this.phase='player';banner('你的回合');SFX.play('turn')},.3)}
  endTurn(){if(this.phase!=='player'||this.busy||this.over)return;this.cancelSel();this.phase='enemy';SFX.play('click');const P=this.P,A=this.A;
    this.add(()=>{
      for(const c of [...this.hand]){if(c.id==='Burn')A.later(()=>this.dealDamage(null,P,2,'thorns'),.2);if(c.id==='Doubt')A.later(()=>{this.applyPower(P,'weak',1,{isM:true})},.15);if(c.id==='Regret')A.loseHp(this.hand.length)}
      if(pw(P,'metal'))A.gainBlockRaw(P.powers.metal);
      if(pw(P,'combust')){A.loseHp(1);const d=P.powers.combust;A.later(()=>this.alive().forEach(m=>this.dealDamage(P,m,d,'thorns')),.2)}
      A.later(()=>{if(hasRelic('Orichalcum')&&P.block===0){flashRelic('Orichalcum');this.gainBlock(P,6)}});
      if(pw(P,'flex')){const f=P.powers.flex;A.later(()=>{this.setPow(P,'str',pw(P,'str')-f);delete P.powers.flex})}
      A.later(()=>{delete P.powers.rage;delete P.powers.flameB;delete P.powers.entangled;this.monsters.forEach(m=>{delete m.powers.choked})});
      if(pw(P,'wraith'))A.pow(P,'dex',-P.powers.wraith,P,true);
      A.later(()=>this.discardHand(),.25)});
    this.add(()=>banner('敌方回合'),.6);
    for(const m of this.monsters)this.add(()=>this.monsterTurn(m));
    this.add(()=>this.endRound(),.1);
    this.add(()=>this.startTurn())}
  monsterTurn(m){if(m.dead||this.over)return;const A=this.A;
    if(!pw(m,'barricade'))m.block=0;
    if(pw(m,'poison')>0){const p=m.powers.poison;this.loseHp(m,p,'poison');m.powers.poison=p-1;if(!m.powers.poison)delete m.powers.poison;this.checkDeaths();if(m.dead){this.wait=.5;return}this.wait=.35}
    A.later(()=>{if(m.dead)return;m.hist.push(m.move.id);m.def.act(m,A)},.1);
    A.later(()=>{if(m.dead)return;if(pw(m,'metal'))this.gainBlock(m,m.powers.metal);if(pw(m,'shackled')){this.setPow(m,'str',pw(m,'str')+m.powers.shackled);delete m.powers.shackled}},.35)}
  endRound(){for(const a of [this.P,...this.alive()]){
      if(!a.isP&&pw(a,'ritual')){if(a.ritualSkip)a.ritualSkip=false;else this.applyPower(a,'str',a.powers.ritual,a)}
      if(a.isP&&pw(a,'ritual'))this.applyPower(a,'str',a.powers.ritual,a);
      for(const k of DEBUFF_TURN){if(pw(a,k)>0){if(a.just[k]){a.just[k]=false;continue}a.powers[k]--;if(!a.powers[k])delete a.powers[k]}}
      if(a.isP&&pw(a,'intang')>0){a.powers.intang--;if(!a.powers.intang)delete a.powers.intang}}
    for(const m of this.alive()){if(m.move&&m.move.id==='split'&&m.splitPending)continue;m.move=this.roll(m)}}
  /* ---------- cards ---------- */
  cardDmg(c,t){if(!c||c.type!=='ATTACK')return c?c.dmg:0;let base=c.dmg,mult=1;
    if(c.id==='PerfectedStrike')base+=c.mag*[...this.hand,...this.draw,...this.discard].filter(x=>CARDS[x.id].tags&&CARDS[x.id].tags.includes('strike')).length+(this.hand.includes(c)?0:c.mag);
    if(c.id==='BodySlam')base=this.P.block;if(c.id==='HeavyBlade')mult=c.mag;if(c.id==='Shiv')base+=pw(this.P,'accuracy');
    const nib=this.nibNext(c);if(nib)this.P.powers.penNib=1;const d=normalDamage(base,this.P,t&&!t.dead?t:null,mult);if(nib)delete this.P.powers.penNib;return d}
  nibNext(c){const r=relicOf('PenNib');return r&&c.type==='ATTACK'&&r.counter===9&&this.hand.includes(c)}
  cardBlk(c){return normalBlock(c.blk,this.P)}
  costOf(c){return c.costTurn??c.cost}
  canPlay(c){if(this.phase!=='player'||this.over||this.selecting)return false;if(c.cost===-2)return false;
    if(c.type==='ATTACK'&&pw(this.P,'entangled'))return false;const k=this.costOf(c);if(k>=0&&this.energy<k)return false;return true}
  needsTarget(c){return c.target==='enemy'}
  playCard(c,t){if(!this.canPlay(c))return false;if(this.needsTarget(c)){if(!t||t.dead)t=this.alive().length===1?this.alive()[0]:null;if(!t)return false}
    const k=this.costOf(c);let x=0;if(c.cost===-1){x=this.energy;this.energy=0}else this.energy-=k;
    this.hand.splice(this.hand.indexOf(c),1);G.stats.cards++;this.cardsTurn++;if(c.type==='ATTACK')this.attacksTurn++;if(c.type==='SKILL')this.skillsTurn++;
    const el=this.els.get(c.uid);if(el){el.classList.remove('sel','glow');el.style.zIndex=90;el.style.transform=`translate(${560}px,${250}px) rotate(0deg) scale(1)`}
    SFX.play('card');this.targeting=null;this.drawArrow(null);
    this.cardQ.push({fn:()=>this.useCard(c,t,x),dur:.12});this.layoutHand();this.refresh();return true}
  useCard(c,t,x){const A=this.A,P=this.P,d=CARDS[c.id];
    const pn=relicOf('PenNib');let nib=false;if(c.type==='ATTACK'&&pn){pn.counter++;if(pn.counter>=10){pn.counter=0;nib=true;flashRelic('PenNib');P.powers.penNib=1}renderHud()}
    if(d.use&&!(t&&t.dead&&this.needsTarget(c)))d.use(c,A,t,x);
    if(nib)A.later(()=>{delete P.powers.penNib});
    if(c.type==='ATTACK'&&pw(P,'vigor'))A.later(()=>delete P.powers.vigor);
    if(c.type==='ATTACK'&&pw(P,'rage'))A.gainBlockRaw(P.powers.rage);

  /* ---------- deaths & ending ---------- */
  checkDeaths(){if(this.over)return;

  /* ---------- api for cards / monsters ---------- */
  api(){const b=this;return{B:b,get P(){return b.P},
    atk(c,t,times=1){const d=b.cardDmg(c,t);for(let i=0;i<times;i++)b.add(()=>{if(!t||t.dead)return;b.anim(b.P,'lunge-r');b.slash(t);b.dealDamage(b.P,t,d,'attack')},.2)},
    atkNow(c,t){const d=b.cardDmg(c,t);b.slash(t);b.dealDamage(b.P,t,d,'attack')},
    atkAll(c,times=1,reaper=false){for(let i=0;i<times;i++){const ds=b.alive().map(m=>[m,b.cardDmg(c,m)]);b.add(()=>{b.anim(b.P,'lunge-r');let tot=0;for(const [m,d] of ds){if(!m.dead){b.slash(m);tot+=Math.max(0,b.dealDamage(b.P,m,d,'attack'))}}if(reaper&&tot>0)b.healP(tot)},.25)}},
    block(c){const v=b.cardBlk(c);b.add(()=>b.gainBlock(b.P,v),.1)},
    gainBlockRaw(n){b.add(()=>b.gainBlock(b.P,n),.1)},
    pow(t,k,amt,src=b.P){b.add(()=>b.applyPower(t,k,amt,src),.12)},
    powNow(t,k,amt){b.applyPower(t,k,amt,b.P)},
    powAll(k,amt){b.add(()=>b.alive().forEach(m=>b.applyPower(m,k,amt,b.P)),.15)},
    setPow(t,k,v){b.setPow(t,k,v)},
    draw(n){b.add(()=>b.drawCards(n),.1)},
    discardSel(n){b.add(()=>b.selectHand(n,'选择要丢弃的牌',null,s=>s.forEach(x=>b.discardCard(x,true))))},
    discardRandom(){b.add(()=>{if(b.hand.length)b.discardCard(b.hand[G.rng.cardRandom.random(b.hand.length-1)],true)},.1)},
    exhaustRandom(){b.add(()=>{if(b.hand.length)b.exhaustCard(b.hand[G.rng.cardRandom.random(b.hand.length-1)])},.1)},
    exhaustCard(x){b.exhaustCard(x)},
    select(pile,n,msg,filter,cb){b.add(()=>b.selectHand(n,msg,filter,cb))},
    gridPick(pile,n,msg,cb){b.add(()=>b.gridPickPile(pile,n,msg,cb))},

    mHit(m,base,hits=1){for(let i=0;i<hits;i++)b.add(()=>{if(m.dead||b.over)return;const d=normalDamage(base,m,b.P);b.anim(m,'lunge-l');b.dealDamage(m,b.P,d,'attack')},hits>1?.18:.35)},
    mBlock(m,n){b.add(()=>b.gainBlock(m,n),.15)},
